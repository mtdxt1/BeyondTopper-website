# Netlify config — Beyond Topper Fee Deposit System

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Daily reminder scan at 09:00 IST (03:30 UTC)
[functions."send-reminders"]
  schedule = "30 3 * * *"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Admin folder — password protected via Basic Auth (Netlify _headers alternative)
[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200
